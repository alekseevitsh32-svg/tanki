<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Танк 3D - tank_1.html</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            z-index: 10;
            backdrop-filter: blur(8px);
            border: 2px solid #ffaa00;
            text-align: center;
            pointer-events: none;
            user-select: none;
        }
        #info h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
        }
        #info h1 span {
            color: #ffaa00;
        }
        #info p {
            margin: 4px 0 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #ddd;
            padding: 10px 24px;
            border-radius: 40px;
            backdrop-filter: blur(8px);
            border: 1px solid #444;
            z-index: 10;
            font-size: 0.9rem;
            display: flex;
            gap: 30px;
            letter-spacing: 0.5px;
        }
        #controls kbd {
            background: #2a2a3a;
            padding: 3px 12px;
            border-radius: 6px;
            color: #ffaa00;
            font-weight: 700;
            border: 1px solid #555;
        }
        #status {
            position: absolute;
            bottom: 100px;
            right: 30px;
            color: #0f0;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            border: 1px solid #2a5a2a;
            z-index: 10;
            pointer-events: none;
        }
        @media (max-width: 700px) {
            #info h1 { font-size: 1.2rem; }
            #controls { flex-wrap: wrap; gap: 10px; width: 90%; bottom: 15px; }
            #status { bottom: 80px; right: 10px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>⚙️ <span>ТАНК</span> 3D</h1>
        <p>Модель собрана из примитивов · Three.js</p>
    </div>
    <div id="status">
        <span id="coords">X: 0.0 | Z: 0.0</span>
    </div>
    <div id="controls">
        <span><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> — движение</span>
        <span><kbd>↑</kbd> <kbd>↓</kbd> — наклон башни</span>
        <span><kbd>ПРОБЕЛ</kbd> — выстрел</span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- Инициализация ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 30, 60);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(8, 6, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // CSS2D рендерер для лейблов
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- Орбит контрол (для обзора) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.target.set(0, 0.5, 0);
        controls.maxPolarAngle = Math.PI / 2.4;
        controls.minDistance = 4;
        controls.maxDistance = 25;

        // --- Свет ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        mainLight.position.set(10, 20, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 50;
        mainLight.shadow.camera.left = -20;
        mainLight.shadow.camera.right = 20;
        mainLight.shadow.camera.top = 20;
        mainLight.shadow.camera.bottom = -20;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.5);
        fillLight.position.set(-10, 5, -10);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xffaa55, 0.3);
        backLight.position.set(-5, 5, -15);
        scene.add(backLight);

        // --- Пол (сетка) ---
        const gridHelper = new THREE.GridHelper(30, 20, 0xffaa00, 0x445566);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        // Пол для теней
        const groundMat = new THREE.ShadowMaterial({ opacity: 0.3 });
        const groundPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 30),
            groundMat
        );
        groundPlane.rotation.x = -Math.PI / 2;
        groundPlane.position.y = -0.01;
        groundPlane.receiveShadow = true;
        scene.add(groundPlane);

        // Декоративные "деревья" (столбы)
        for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2;
            const radius = 8 + Math.random() * 4;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            
            const pillar = new THREE.Mesh(
                new THREE.CylinderGeometry(0.15, 0.25, 1.5, 6),
                new THREE.MeshStandardMaterial({ color: 0x8B7355, roughness: 0.8 })
            );
            pillar.position.set(x, 0.75, z);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            scene.add(pillar);

            const top = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 6),
                new THREE.MeshStandardMaterial({ color: 0x2d8a4e, roughness: 0.6 })
            );
            top.position.set(x, 1.6, z);
            top.castShadow = true;
            scene.add(top);
        }

        // --- СОЗДАНИЕ ТАНКА (модель из примитивов) ---
        const tankGroup = new THREE.Group();

        // ----- Корпус -----
        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: 0x5a7a3a, 
            roughness: 0.6, 
            metalness: 0.3 
        });
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 3.6), bodyMat);
        body.position.y = 0.3;
        body.castShadow = true;
        body.receiveShadow = true;
        tankGroup.add(body);

        // Детали корпуса - броневые листы
        const armorMat = new THREE.MeshStandardMaterial({ color: 0x6a8a4a, roughness: 0.5, metalness: 0.4 });
        const armorFront = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.15, 0.3), armorMat);
        armorFront.position.set(0, 0.45, 1.85);
        armorFront.castShadow = true;
        tankGroup.add(armorFront);

        const armorBack = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.15, 0.3), armorMat);
        armorBack.position.set(0, 0.45, -1.85);
        armorBack.castShadow = true;
        tankGroup.add(armorBack);

        // ----- Башня -----
        const turretMat = new THREE.MeshStandardMaterial({ 
            color: 0x6d8c4a, 
            roughness: 0.5, 
            metalness: 0.5 
        });
        const turretBase = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.3, 0.5, 16), turretMat);
        turretBase.position.y = 0.85;
        turretBase.castShadow = true;
        turretBase.receiveShadow = true;
        tankGroup.add(turretBase);

        const turretTop = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.1, 0.35, 16), turretMat);
        turretTop.position.y = 1.1;
        turretTop.castShadow = true;
        turretTop.receiveShadow = true;
        tankGroup.add(turretTop);

        // ----- Дуло (ствол) -----
        const barrelGroup = new THREE.Group();
        barrelGroup.position.set(0, 1.05, 0.6);

        const barrelMat = new THREE.MeshStandardMaterial({ 
            color: 0x3a3a3a, 
            roughness: 0.4, 
            metalness: 0.7 
        });
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 1.8, 8), barrelMat);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.z = 0.9;
        barrel.castShadow = true;
        barrelGroup.add(barrel);

        // Набалдашник дула
        const muzzleMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.8, roughness: 0.3 });
        const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.15, 8), muzzleMat);
        muzzle.rotation.x = Math.PI / 2;
        muzzle.position.z = 1.8;
        muzzle.castShadow = true;
        barrelGroup.add(muzzle);

        // Броня вокруг дула
        const mantletMat = new THREE.MeshStandardMaterial({ color: 0x5a7a3a, roughness: 0.6 });
        const mantlet = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.3), mantletMat);
        mantlet.position.set(0, 0, 0.5);
        mantlet.castShadow = true;
        barrelGroup.add(mantlet);

        tankGroup.add(barrelGroup);

        // Сохраняем ссылку на башню для управления наклоном
        const turretPivot = new THREE.Group();
        turretPivot.position.set(0, 0.85, 0);
        // Переносим башню и дуло в pivot
        turretPivot.add(turretBase);
        turretPivot.add(turretTop);
        turretPivot.add(barrelGroup);
        // Перемещаем barrelGroup в правильную позицию относительно pivot
        barrelGroup.position.set(0, 0.2, 0.6);
        tankGroup.add(turretPivot);

        // Сохраняем ссылку на barrelGroup для наклона
        const barrelPivot = barrelGroup;

        // ----- Гусеницы (траки) -----
        const trackMat = new THREE.MeshStandardMaterial({ 
            color: 0x222222, 
            roughness: 0.9, 
            metalness: 0.1 
        });
        
        // Левая гусеница
        const trackLeft = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.25, 3.8), trackMat);
        trackLeft.position.set(-1.35, 0.15, 0);
        trackLeft.castShadow = true;
        trackLeft.receiveShadow = true;
        tankGroup.add(trackLeft);

        // Правая гусеница
        const trackRight = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.25, 3.8), trackMat);
        trackRight.position.set(1.35, 0.15, 0);
        trackRight.castShadow = true;
        trackRight.receiveShadow = true;
        tankGroup.add(trackRight);

        // Колеса (декоративные)
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8, metalness: 0.2 });
        for (let side = -1; side <= 1; side += 2) {
            for (let i = -1; i <= 1; i++) {
                const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.12, 8), wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(side * 1.35, 0.15, i * 1.2);
                wheel.castShadow = true;
                tankGroup.add(wheel);
            }
        }

        // ----- Детали: люк, антенна -----
        const hatchMat = new THREE.MeshStandardMaterial({ color: 0x4a6a2a, roughness: 0.7 });
        const hatch = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.08, 8), hatchMat);
        hatch.position.set(0.4, 1.25, -0.3);
        hatch.castShadow = true;
        tankGroup.add(hatch);

        const antennaMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.5, roughness: 0.4 });
        const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.8, 4), antennaMat);
        antenna.position.set(0.5, 1.4, -0.5);
        antenna.castShadow = true;
        tankGroup.add(antenna);

        // Добавляем танк на сцену
        tankGroup.position.set(0, 0, 0);
        scene.add(tankGroup);

        // --- Лейбл над танком ---
        const labelDiv = document.createElement('div');
        labelDiv.textContent = '⚔️ Т-34';
        labelDiv.style.color = '#ffaa00';
        labelDiv.style.fontWeight = 'bold';
        labelDiv.style.fontSize = '16px';
        labelDiv.style.textShadow = '0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.5)';
        labelDiv.style.background = 'rgba(0,0,0,0.6)';
        labelDiv.style.padding = '4px 16px';
        labelDiv.style.borderRadius = '20px';
        labelDiv.style.border = '1px solid #ffaa00';
        labelDiv.style.backdropFilter = 'blur(4px)';
        
        const label = new CSS2DObject(labelDiv);
        label.position.set(0, 2.5, 0);
        tankGroup.add(label);

        // --- Управление ---
        const keys = {
            w: false, a: false, s: false, d: false,
            arrowup: false, arrowdown: false,
            space: false
        };

        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': keys.w = true; e.preventDefault(); break;
                case 'a': keys.a = true; e.preventDefault(); break;
                case 's': keys.s = true; e.preventDefault(); break;
                case 'd': keys.d = true; e.preventDefault(); break;
                case 'arrowup': keys.arrowup = true; e.preventDefault(); break;
                case 'arrowdown': keys.arrowdown = true; e.preventDefault(); break;
                case ' ': keys.space = true; e.preventDefault(); break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': keys.w = false; e.preventDefault(); break;
                case 'a': keys.a = false; e.preventDefault(); break;
                case 's': keys.s = false; e.preventDefault(); break;
                case 'd': keys.d = false; e.preventDefault(); break;
                case 'arrowup': keys.arrowup = false; e.preventDefault(); break;
                case 'arrowdown': keys.arrowdown = false; e.preventDefault(); break;
                case ' ': keys.space = false; e.preventDefault(); break;
            }
        });

        // --- Выстрелы (снаряды) ---
        const bullets = [];
        const bulletSpeed = 12;
        let shotCount = 0;

        function shoot() {
            // Получаем направление дула в мире
            const barrelPos = new THREE.Vector3(0, 0.9, 1.8);
            barrelPos.applyQuaternion(tankGroup.quaternion);
            barrelPos.add(tankGroup.position);

            // Направление выстрела
            const dir = new THREE.Vector3(0, 0, 1);
            dir.applyQuaternion(tankGroup.quaternion);
            // Учитываем наклон башни
            const barrelRot = new THREE.Euler(0, 0, 0);
            barrelRot.x = -barrelPivot.rotation.x;
            dir.applyEuler(barrelRot);
            dir.normalize();

            const bulletMat = new THREE.MeshStandardMaterial({ 
                color: 0xff5500, 
                emissive: 0xff2200, 
                emissiveIntensity: 0.5 
            });
            const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), bulletMat);
            bullet.position.copy(barrelPos);
            bullet.castShadow = true;
            scene.add(bullet);

            // Свет от выстрела
            const flash = new THREE.PointLight(0xff6600, 2, 5);
            flash.position.copy(barrelPos);
            scene.add(flash);
            setTimeout(() => scene.remove(flash), 100);

            bullets.push({
                mesh: bullet,
                velocity: dir.multiplyScalar(bulletSpeed),
                life: 3.0
            });

            shotCount++;
            document.getElementById('shotsDisplay').textContent = `Выстрелов: ${shotCount}`;
        }

        // --- Обновление координат ---
        const coordsEl = document.getElementById('coords');

        // --- Анимация ---
        let clock = new THREE.Clock();

        function animate() {
            const delta = Math.min(clock.getDelta(), 0.05);
            const time = clock.elapsedTime;

            // --- Движение танка ---
            const moveSpeed = 3.5;
            const rotSpeed = 2.5;
            let forward = 0, turn = 0;

            if (keys.w) forward = 1;
            if (keys.s) forward = -1;
            if (keys.a) turn = 1;
            if (keys.d) turn = -1;

            // Движение вперед/назад
            if (forward !== 0) {
                const moveVec = new THREE.Vector3(0, 0, forward * moveSpeed * delta);
                moveVec.applyQuaternion(tankGroup.quaternion);
                tankGroup.position.add(moveVec);
            }

            // Поворот
            if (turn !== 0) {
                tankGroup.rotation.y += turn * rotSpeed * delta;
            }

            // Наклон башни (вверх/вниз)
            if (keys.arrowup) {
                barrelPivot.rotation.x = Math.max(-0.6, barrelPivot.rotation.x - 0.02);
            }
            if (keys.arrowdown) {
                barrelPivot.rotation.x = Math.min(0.6, barrelPivot.rotation.x + 0.02);
            }

            // Выстрел
            if (keys.space) {
                keys.space = false;
                shoot();
            }

            // --- Обновление снарядов ---
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.add(b.velocity.clone().multiplyScalar(delta));
                b.life -= delta;

                // Снаряд исчезает через 3 секунды или за пределами поля
                if (b.life <= 0 || Math.abs(b.mesh.position.x) > 20 || Math.abs(b.mesh.position.z) > 20) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // --- Обновление UI ---
            coordsEl.textContent = `X: ${tankGroup.position.x.toFixed(1)} | Z: ${tankGroup.position.z.toFixed(1)}`;

            // --- Рендер ---
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);

            requestAnimationFrame(animate);
        }

        animate();

        // --- Адаптация под размер окна ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        });

        // FPS счетчик (простой)
        let frameCount = 0;
        let lastFPSTime = performance.now();
        setInterval(() => {
            const now = performance.now();
            const fps = Math.round(frameCount / ((now - lastFPSTime) / 1000));
            document.getElementById('fpsDisplay').textContent = `FPS: ${fps}`;
            frameCount = 0;
            lastFPSTime = now;
        }, 1000);

        // Переопределяем счетчик FPS
        const origAnimate = animate;
        animate = function() {
            frameCount++;
            origAnimate.call(this);
        };
        // Запускаем заново
        // (просто оставляем как есть, счетчик обновляется в setInterval)

        console.log('Танк загружен! Управление: WASD - движение, стрелки - наклон башни, Пробел - выстрел.');
    </script>
</body>
</html>
