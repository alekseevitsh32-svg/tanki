<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Танк - Редактор и Игра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        #gameContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        
        #gameContainer iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Верхняя панель */
        #navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 10, 30, 0.9);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #ffaa00;
            box-shadow: 0 4px 30px rgba(0,0,0,0.9);
            transition: transform 0.3s ease;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            color: white;
            font-size: 1.4rem;
            font-weight: 700;
        }
        
        .logo span {
            color: #ffaa00;
        }
        
        .logo-icon {
            font-size: 2rem;
        }
        
        .nav-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            padding: 8px 20px;
            border: 2px solid #ffaa00;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.3s ease;
            background: rgba(255, 170, 0, 0.1);
            color: #ffaa00;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 170, 0, 0.3);
        }
        
        .nav-btn.active {
            background: #ffaa00;
            color: #0a0a1a;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.4);
        }
        
        .nav-btn.editor-btn.active {
            background: #44aa44;
            border-color: #44aa44;
            color: white;
            box-shadow: 0 0 30px rgba(68, 170, 68, 0.4);
        }
        
        .nav-btn.game-btn.active {
            background: #ff6600;
            border-color: #ff6600;
            color: white;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.4);
        }
        
        .nav-btn.editor-btn {
            border-color: #44aa44;
            color: #88ff88;
            background: rgba(68, 170, 68, 0.1);
        }
        
        .nav-btn.game-btn {
            border-color: #ff6600;
            color: #ff8844;
            background: rgba(255, 102, 0, 0.1);
        }
        
        .status-badge {
            color: #88ff88;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 0, 0.08);
            padding: 6px 16px;
            border-radius: 25px;
            border: 1px solid rgba(68, 170, 68, 0.3);
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        
        .status-dot.editor {
            background: #44ff44;
        }
        
        .status-dot.game {
            background: #ff6600;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        
        /* Кнопка скрытия панели */
        #toggleNav {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 101;
            background: rgba(0,0,0,0.7);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: none;
        }
        
        #toggleNav:hover {
            background: #ffaa00;
            color: #0a0a1a;
        }
        
        /* Информация внизу */
        #gameInfo {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 8px 24px;
            border-radius: 30px;
            backdrop-filter: blur(6px);
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap;
        }
        
        #modeIndicator {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 50;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            backdrop-filter: blur(8px);
            pointer-events: none;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        #modeIndicator.editor-mode {
            background: rgba(68, 170, 68, 0.2);
            border: 2px solid #44aa44;
            color: #88ff88;
        }
        
        #modeIndicator.game-mode {
            background: rgba(255, 102, 0, 0.2);
            border: 2px solid #ff6600;
            color: #ff8844;
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            #navbar {
                padding: 8px 12px;
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .logo {
                font-size: 1rem;
            }
            
            .logo-icon {
                font-size: 1.3rem;
            }
            
            .nav-btn {
                padding: 5px 12px;
                font-size: 0.75rem;
            }
            
            .status-badge {
                font-size: 0.65rem;
                padding: 3px 10px;
            }
            
            #gameInfo {
                font-size: 0.6rem;
                padding: 4px 12px;
                bottom: 10px;
                white-space: normal;
            }
            
            #modeIndicator {
                top: 70px;
                right: 10px;
                font-size: 0.8rem;
                padding: 6px 12px;
            }
        }
        
        @media (max-width: 480px) {
            .nav-controls .nav-btn:not(.active) {
                display: none;
            }
            
            .nav-controls .nav-btn.active {
                font-size: 0.7rem;
                padding: 4px 10px;
            }
            
            .status-badge span:last-child {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Панель навигации -->
    <div id="navbar">
        <div class="logo">
            <span class="logo-icon">⚔️</span>
            <span>ТАНКИ</span>
            <span style="font-weight: 300; font-size: 0.8rem; opacity: 0.7;" id="modeLabel">| Редактор</span>
        </div>
        
        <div class="nav-controls">
            <div class="status-badge">
                <span class="status-dot editor" id="statusDot"></span>
                <span id="statusText">Редактор</span>
            </div>
            <button class="nav-btn editor-btn active" id="btnEditor" onclick="switchToEditor()">
                🛠️ Редактор
            </button>
            <button class="nav-btn game-btn" id="btnGame" onclick="switchToGame()">
                🎮 Игра
            </button>
            <button class="nav-btn" onclick="reloadFrame()" style="border-color: #666; color: #aaa; background: rgba(255,255,255,0.05);">
                🔄
            </button>
            <button class="nav-btn" onclick="toggleFullscreen()" style="border-color: #666; color: #aaa; background: rgba(255,255,255,0.05);">
                ⛶
            </button>
        </div>
    </div>
    
    <!-- Контейнер -->
    <div id="gameContainer">
        <iframe id="gameFrame" src="editor.html" loading="lazy"></iframe>
    </div>
    
    <!-- Индикатор режима -->
    <div id="modeIndicator" class="editor-mode">
        🛠️ РЕДАКТОР
    </div>
    
    <!-- Информация внизу -->
    <div id="gameInfo">
        <span id="infoText">🛠️ Редактор блоков: добавляйте блоки, изменяйте размеры и позиции</span>
    </div>
    
    <button id="toggleNav" onclick="toggleNav()">−</button>

    <script>
        let navVisible = true;
        let currentMode = 'editor';
        const navbar = document.getElementById('navbar');
        const toggleBtn = document.getElementById('toggleNav');
        const gameFrame = document.getElementById('gameFrame');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const infoText = document.getElementById('infoText');
        const modeIndicator = document.getElementById('modeIndicator');
        const modeLabel = document.getElementById('modeLabel');
        const btnEditor = document.getElementById('btnEditor');
        const btnGame = document.getElementById('btnGame');
        
        function switchToEditor() {
            if (currentMode === 'editor') return;
            currentMode = 'editor';
            gameFrame.src = 'editor.html';
            
            statusText.textContent = 'Редактор';
            statusDot.className = 'status-dot editor';
            infoText.textContent = '🛠️ Редактор блоков: добавляйте блоки, изменяйте размеры и позиции';
            modeIndicator.textContent = '🛠️ РЕДАКТОР';
            modeIndicator.className = 'editor-mode';
            modeLabel.textContent = '| Редактор';
            
            btnEditor.className = 'nav-btn editor-btn active';
            btnGame.className = 'nav-btn game-btn';
        }
        
        function switchToGame() {
            if (currentMode === 'game') return;
            currentMode = 'game';
            gameFrame.src = 'tank_1.html';
            
            statusText.textContent = 'Игра';
            statusDot.className = 'status-dot game';
            infoText.textContent = '🎮 Управление: WASD — движение | Стрелки — наклон башни | Пробел — выстрел';
            modeIndicator.textContent = '🎮 ИГРА';
            modeIndicator.className = 'game-mode';
            modeLabel.textContent = '| Игра';
            
            btnGame.className = 'nav-btn game-btn active';
            btnEditor.className = 'nav-btn editor-btn';
        }
        
        function reloadFrame() {
            const container = document.getElementById('gameContainer');
            container.style.opacity = '0.3';
            container.style.transition = 'opacity 0.2s';
            
            setTimeout(() => {
                gameFrame.src = gameFrame.src;
                container.style.opacity = '1';
            }, 200);
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log('Ошибка полноэкранного режима:', err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
        
        function toggleNav() {
            navVisible = !navVisible;
            navbar.style.transform = navVisible ? 'translateY(0)' : 'translateY(-100%)';
            toggleBtn.textContent = navVisible ? '−' : '+';
        }
        
        // Авто-скрытие панели
        let hoverTimeout;
        document.addEventListener('mousemove', (e) => {
            if (e.clientY < 50) {
                clearTimeout(hoverTimeout);
                if (!navVisible) {
                    navbar.style.transform = 'translateY(0)';
                    toggleBtn.textContent = '−';
                    navVisible = true;
                }
            } else if (navVisible && e.clientY > 100) {
                hoverTimeout = setTimeout(() => {
                    if (navVisible) {
                        navbar.style.transform = 'translateY(-100%)';
                        navVisible = false;
                        toggleBtn.textContent = '+';
                    }
                }, 2000);
            }
        });
        
        toggleBtn.style.display = 'block';
        
        // Полноэкранный режим
        document.addEventListener('fullscreenchange', () => {
            const isFull = document.fullscreenElement;
            const btns = document.querySelectorAll('.nav-btn');
            btns.forEach(btn => {
                if (btn.textContent.includes('⛶') || btn.textContent.includes('⬛')) {
                    btn.textContent = isFull ? '⬛' : '⛶';
                }
            });
        });
        
        // Обработка ошибки
        gameFrame.addEventListener('error', () => {
            document.getElementById('gameContainer').innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; height: 100vh; 
                     background: #0a0a1a; color: #ff6b6b; flex-direction: column; gap: 20px; padding: 20px;">
                    <div style="font-size: 4rem;">⚠️</div>
                    <h2>Не удалось загрузить файл</h2>
                    <p style="color: #aaa; max-width: 500px; text-align: center;">
                        Убедитесь, что файлы <strong style="color: #ffaa00;">editor.html</strong> и 
                        <strong style="color: #ffaa00;">tank_1.html</strong> находятся в той же папке
                    </p>
                    <button onclick="location.reload()" style="padding: 10px 30px; background: #ffaa00; 
                            border: none; border-radius: 8px; color: #0a0a1a; font-weight: bold; cursor: pointer; 
                            font-size: 1.1rem;">
                        🔄 Обновить
                    </button>
                </div>
            `;
        });
        
        // Горячие клавиши
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F5') {
                e.preventDefault();
                reloadFrame();
            }
            if (e.ctrlKey && e.key === '1') {
                e.preventDefault();
                switchToEditor();
            }
            if (e.ctrlKey && e.key === '2') {
                e.preventDefault();
                switchToGame();
            }
        });
        
        console.log('✅ index.html загружен!');
        console.log('🛠️ Редактор: editor.html');
        console.log('🎮 Игра: tank_1.html');
        console.log('⌨️ Ctrl+1 - редактор, Ctrl+2 - игра, F5 - обновить');
    </script>
</body>
</html>
