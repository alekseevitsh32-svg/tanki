<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Танк - Редактор и Игра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        /* Контейнер для iframe */
        #gameContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        
        #gameContainer iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Верхняя панель навигации */
        #navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 10, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ffaa00;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            transition: transform 0.3s ease;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .logo span {
            color: #ffaa00;
        }
        
        .logo-icon {
            font-size: 1.8rem;
        }
        
        .nav-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            background: rgba(255, 170, 0, 0.15);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .nav-btn:hover {
            background: #ffaa00;
            color: #0a0a1a;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.4);
        }
        
        .nav-btn.active {
            background: #ffaa00;
            color: #0a0a1a;
        }
        
        .nav-btn.green {
            border-color: #44aa44;
            color: #88ff88;
            background: rgba(68, 170, 68, 0.15);
        }
        
        .nav-btn.green:hover {
            background: #44aa44;
            color: #0a0a1a;
        }
        
        .status-badge {
            color: #88ff88;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 0, 0.1);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #44aa44;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #44ff44;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        
        /* Кнопка скрытия панели */
        #toggleNav {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 101;
            background: rgba(0,0,0,0.6);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: none;
        }
        
        #toggleNav:hover {
            background: #ffaa00;
            color: #0a0a1a;
        }
        
        /* Информация об игре */
        #gameInfo {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 6px 20px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            #navbar {
                padding: 8px 12px;
                flex-wrap: wrap;
                gap: 8px;
            }
            
            .logo {
                font-size: 1rem;
            }
            
            .logo-icon {
                font-size: 1.3rem;
            }
            
            .nav-btn {
                padding: 4px 12px;
                font-size: 0.75rem;
            }
            
            .status-badge {
                font-size: 0.65rem;
                padding: 2px 10px;
            }
            
            #gameInfo {
                font-size: 0.6rem;
                padding: 4px 12px;
                bottom: 10px;
            }
        }
        
        @media (max-width: 480px) {
            .nav-controls .nav-btn:not(.active) {
                display: none;
            }
            
            .nav-controls .nav-btn.active {
                font-size: 0.7rem;
                padding: 3px 10px;
            }
            
            .status-badge span {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Навигационная панель -->
    <div id="navbar">
        <div class="logo">
            <span class="logo-icon">⚔️</span>
            <span>ТАНКИ</span>
            <span style="font-weight: 300; font-size: 0.8rem; opacity: 0.7;">| Редактор + Игра</span>
        </div>
        
        <div class="nav-controls">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="statusText">Редактор</span>
            </div>
            <button class="nav-btn active" id="btnEditor" onclick="switchToEditor()">
                🛠️ Редактор
            </button>
            <button class="nav-btn" id="btnGame" onclick="switchToGame()">
                🎮 Игра
            </button>
            <button class="nav-btn" onclick="reloadFrame()">
                🔄 Обновить
            </button>
            <button class="nav-btn" onclick="toggleFullscreen()">
                ⛶ На весь экран
            </button>
        </div>
    </div>
    
    <!-- Контейнер для iframe -->
    <div id="gameContainer">
        <iframe id="gameFrame" src="editor.html" loading="lazy"></iframe>
    </div>
    
    <!-- Нижняя информация -->
    <div id="gameInfo">
        <span id="infoText">🛠️ Редактор блоков: добавляйте блоки, изменяйте размеры и позиции</span>
    </div>
    
    <!-- Кнопка скрытия панели -->
    <button id="toggleNav" onclick="toggleNav()">−</button>

    <script>
        // Переменные
        let navVisible = true;
        let currentMode = 'editor';
        const navbar = document.getElementById('navbar');
        const toggleBtn = document.getElementById('toggleNav');
        const gameFrame = document.getElementById('gameFrame');
        const statusText = document.getElementById('statusText');
        const infoText = document.getElementById('infoText');
        const btnEditor = document.getElementById('btnEditor');
        const btnGame = document.getElementById('btnGame');
        
        // Переключение на редактор
        function switchToEditor() {
            if (currentMode === 'editor') return;
            currentMode = 'editor';
            gameFrame.src = 'editor.html';
            statusText.textContent = 'Редактор';
            infoText.textContent = '🛠️ Редактор блоков: добавляйте блоки, изменяйте размеры и позиции';
            btnEditor.classList.add('active');
            btnGame.classList.remove('active');
            document.querySelector('.logo span:last-child').textContent = '| Редактор + Игра';
        }
        
        // Переключение на игру
        function switchToGame() {
            if (currentMode === 'game') return;
            currentMode = 'game';
            gameFrame.src = 'tank_1.html';
            statusText.textContent = 'Игра';
            infoText.textContent = '🎮 Управление: WASD — движение | Стрелки — наклон башни | Пробел — выстрел';
            btnGame.classList.add('active');
            btnEditor.classList.remove('active');
            document.querySelector('.logo span:last-child').textContent = '| Игра + Редактор';
        }
        
        // Перезагрузка iframe
        function reloadFrame() {
            const container = document.getElementById('gameContainer');
            container.style.opacity = '0.5';
            container.style.transition = 'opacity 0.2s';
            
            setTimeout(() => {
                gameFrame.src = gameFrame.src;
                container.style.opacity = '1';
            }, 200);
        }
        
        // Полноэкранный режим
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log('Ошибка полноэкранного режима:', err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
        
        // Скрыть/показать навигацию
        function toggleNav() {
            navVisible = !navVisible;
            navbar.style.transform = navVisible ? 'translateY(0)' : 'translateY(-100%)';
            toggleBtn.textContent = navVisible ? '−' : '+';
        }
        
        // Показываем кнопку скрытия при наведении на верхнюю часть экрана
        let hoverTimeout;
        document.addEventListener('mousemove', (e) => {
            if (e.clientY < 50) {
                clearTimeout(hoverTimeout);
                if (!navVisible) {
                    navbar.style.transform = 'translateY(0)';
                    toggleBtn.textContent = '−';
                }
            } else if (navVisible && e.clientY > 100) {
                hoverTimeout = setTimeout(() => {
                    if (navVisible) {
                        navbar.style.transform = 'translateY(-100%)';
                        navVisible = false;
                        toggleBtn.textContent = '+';
                    }
                }, 2000);
            }
        });
        
        // Показываем кнопку скрытия всегда
        toggleBtn.style.display = 'block';
        
        // Слушаем изменения полноэкранного режима
        document.addEventListener('fullscreenchange', () => {
            const isFull = document.fullscreenElement;
            const btn = document.querySelector('.nav-btn:last-child');
            if (isFull) {
                btn.textContent = '⬛ Выйти';
            } else {
                btn.textContent = '⛶ На весь экран';
            }
        });
        
        // Обработка ошибки загрузки iframe
        gameFrame.addEventListener('error', () => {
            document.getElementById('gameContainer').innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; height: 100vh; 
                     background: #0a0a1a; color: #ff6b6b; flex-direction: column; gap: 20px; padding: 20px;">
                    <div style="font-size: 4rem;">⚠️</div>
                    <h2>Не удалось загрузить файл</h2>
                    <p style="color: #aaa; max-width: 500px; text-align: center;">
                        Убедитесь, что файлы <strong style="color: #ffaa00;">editor.html</strong> и 
                        <strong style="color: #ffaa00;">tank_1.html</strong> находятся в той же папке
                    </p>
                    <button onclick="location.reload()" style="padding: 10px 30px; background: #ffaa00; 
                            border: none; border-radius: 8px; color: #0a0a1a; font-weight: bold; cursor: pointer; 
                            font-size: 1.1rem;">
                        🔄 Обновить
                    </button>
                </div>
            `;
        });
        
        // Клавиатурные сокращения
        document.addEventListener('keydown', (e) => {
            // F5 - перезагрузка
            if (e.key === 'F5') {
                e.preventDefault();
                reloadFrame();
            }
            // Ctrl+1 - редактор
            if (e.ctrlKey && e.key === '1') {
                e.preventDefault();
                switchToEditor();
            }
            // Ctrl+2 - игра
            if (e.ctrlKey && e.key === '2') {
                e.preventDefault();
                switchToGame();
            }
            // Escape - выход из полноэкранного
            if (e.key === 'Escape' && document.fullscreenElement) {
                document.exitFullscreen();
            }
        });
        
        console.log('✅ index.html загружен!');
        console.log('🛠️ Редактор: editor.html');
        console.log('🎮 Игра: tank_1.html');
        console.log('📁 Убедитесь, что оба файла находятся в той же папке.');
        console.log('⌨️ Ctrl+1 - редактор, Ctrl+2 - игра, F5 - обновить');
    </script>
</body>
</html>
